<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Valora | Maintenance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #12355b;
        }

        .maintenance-box {
            width: 90%;
            max-width: 550px;
            background: white;
            padding: 50px 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .status {
            margin-top: 25px;
            padding: 12px;
            background: #eef7ff;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="maintenance-box">

        <div class="icon">🏦</div>

        <h1>Valora is Under Maintenance</h1>

        <p>
            We're currently making some improvements
            to provide you with a better banking experience.
        </p>

        <p>
            Please check back soon.
        </p>

        <div class="status">
            🔧 We'll be back soon
        </div>

    </div>

</body>
</html>
