<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankSphere | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

```
<nav class="navbar">
    <div class="logo">🏦 BankSphere</div>
    <button class="login-btn" onclick="goHome()">Home</button>
</nav>

<main class="auth-container">
    <div class="auth-box">

        <div class="auth-header">
            <h1 id="form-title">Welcome Back</h1>
            <p id="form-subtitle">Login to securely access your account</p>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="primary-btn auth-submit">Login Securely</button>

            <p class="switch-text">
                Don't have an account?
                <a href="#" onclick="showRegister()">Register here</a>
            </p>
        </form>

        <!-- Registration Form -->
        <form id="register-form" style="display: none;">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="register-name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="register-email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="register-phone" placeholder="Enter your phone number" required>
            </div>

            <div class="input-group">
                <label>Create Password</label>
                <input type="password" id="register-password" placeholder="Create a strong password" required>
            </div>

            <button type="submit" class="primary-btn auth-submit">Create Account</button>

            <p class="switch-text">
                Already have an account?
                <a href="#" onclick="showLogin()">Login here</a>
            </p>
        </form>

    </div>
</main>

<script src="script.js"></script>
```

</body>
</html>
