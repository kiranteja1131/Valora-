<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankSphere | Transfer Money</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <nav class="navbar">
        <div class="logo">🏦 BankSphere</div>
        <button class="login-btn" onclick="logout()">Logout</button>
    </nav>

    <main class="transfer-page">

        <section class="transfer-box">

            <button class="back-btn" onclick="goBackToDashboard()">
                ← Back to Dashboard
            </button>

            <div class="transfer-header">
                <p class="welcome-text">SECURE TRANSFER</p>
                <h1>Transfer Money</h1>
                <p>Send money to another Valora account</p>
            </div>

            <form id="transfer-form">

                <div class="transfer-input">
                    <label for="recipient">
                        Recipient Account Number or Phone
                    </label>

                    <input
                        type="text"
                        id="recipient"
                        placeholder="Enter account number or phone number"
                        required
                    >
                </div>

                <div class="transfer-input">
                    <label for="transfer-amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="transfer-amount"
                        placeholder="₹ Enter amount"
                        min="1"
                        required
                    >
                </div>

                <button type="submit" class="transfer-submit-btn">
                    Transfer Money
                </button>

                <p id="transfer-message"></p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
