services:
  mongodb:
    image: mongo:8
    container_name: bm-container
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - banksphere-network

  backend:
    build: ./backend
    image: kiran626/valora-backend:${BUILD_NUMBER:-latest}
    container_name: bb-container
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - banksphere-network

  frontend:
    build: ./frontend
    image: image: kiran626/valora-frontend:${BUILD_NUMBER:-latest}
    container_name: bf-container
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - banksphere-network

volumes:
  mongodb-data:

networks:
  banksphere-network:
